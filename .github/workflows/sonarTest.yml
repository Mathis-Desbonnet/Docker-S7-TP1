name: SONAR Test
on:
    workflow_call:
        inputs:
            environment:
                type: string

jobs:
    test-backend:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: temurin

            - name: Sonar Check
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: mvn -B verify sonar:sonar -Dsonar.projectKey=docker-key-S7-mathisdesbonnet -Dsonar.organization=mathis-desbonnet -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=$SONAR_TOKEN --file ./Server/pom.xml
