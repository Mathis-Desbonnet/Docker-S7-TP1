name: Dev CI
on:
    push:
        branches:
            - "!main"
            - dev
    pull_request:

jobs:
    test-backend:
        runs-on: ubuntu-24.04
        steps:
            #checkout your github code using actions/checkout@v4
            - uses: actions/checkout@v4

            #do the same with another action (actions/setup-java@v4) that enable to setup jdk 21
            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: temurin

            #finally build your app with the latest command
            - name: Build and test with Maven
              run: |
                  cd ./Server
                  mvn -e clean verify
            - name: Sonar Check
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
              run: mvn -B verify sonar:sonar -Dsonar.projectKey=docker-key-S7-mathisdesbonnet -Dsonar.organization=mathis-desbonnet -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=$SONAR_TOKEN --file ./Server/pom.xml
